<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Margo – Trust-first Briefs & Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Simple layout styles – adjust to match your design */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f7f7f7;
    }

    h1, h2 {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .section {
      background: #ffffff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .col {
      flex: 1 1 300px;
      min-width: 0;
    }

    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 0.9rem;
    }

    button {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button.secondary {
      background: #888;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .articles {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .article-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.75rem;
      background: #fafafa;
      cursor: pointer;
    }

    .article-card h3 {
      margin: 0 0 0.25rem 0;
      font-size: 1rem;
    }

    .article-meta {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.25rem;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.85rem;
      background: #f0f0f0;
      padding: 0.75rem;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .ai-answer {
      font-size: 0.9rem;
      white-space: pre-wrap;
      background: #f9f9ff;
      border-radius: 6px;
      padding: 0.75rem;
    }

    .search-results {
      font-size: 0.85rem;
    }

    .search-results ul {
      padding-left: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Margo – Student News Brief & Search</h1>

  <!-- NEWS BRIEF SECTION (P0/P1) -->
  <section class="section" id="news-section">
    <h2>News Brief (P0 / P1)</h2>

    <!-- News prompt area -->
    <label for="news-prompt">
      Your news brief prompt (P0/P1)
      <!-- P0: first 50 words; P1: evolves here -->
    </label>
    <textarea
      id="news-prompt"
      rows="3"
      placeholder="Example: I am a Class 11 student preparing for CBSE boards. Show me daily, bias-aware news about Indian economy and science."
    ></textarea>

    <!-- Controls for generating and resetting -->
    <div>
      <button id="btn-news-generate">Generate / Update Brief</button>
      <button id="btn-news-reset" class="secondary">Hard reset news brief</button>
    </div>
    <div id="news-status" class="status"></div>

    <!-- Articles list + details -->
    <div class="row" style="margin-top: 1rem;">
      <!-- Left: article cards -->
      <div class="col">
        <h3>Articles (click to read)</h3>
        <div id="news-articles" class="articles">
          <!-- Article cards rendered here -->
        </div>
      </div>

      <!-- Right: selected article details -->
      <div class="col">
        <h3>Selected article</h3>
        <pre id="news-article-detail">No article selected yet.</pre>
      </div>
    </div>
  </section>

  <!-- SEARCH SECTION (S0/S1) -->
  <section class="section" id="search-section">
    <h2>Search (S0 / S1)</h2>

    <!-- Search input -->
    <label for="search-input">
      Search query (S0/S1)
    </label>
    <input
      type="text"
      id="search-input"
      placeholder="Example: Explain the new NEP policy for school students"
    />

    <div>
      <button id="btn-search-run">Search / Ask follow‑up</button>
      <button id="btn-search-reset" class="secondary">Start fresh search</button>
    </div>
    <div id="search-status" class="status"></div>

    <div class="row" style="margin-top: 1rem;">
      <!-- Left: AI answer with citations -->
      <div class="col">
        <h3>AI answer (with citations)</h3>
        <div id="search-answer" class="ai-answer">
          Ask a question to see an answer here.
        </div>
      </div>

      <!-- Right: Top 5 results -->
      <div class="col">
        <h3>Top 5 results</h3>
        <div id="search-results" class="search-results">
          <ul id="search-results-list">
            <!-- Results list rendered here -->
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- APP LOGIC -->
  <script>
    // ===========================
    // CONFIG
    // ===========================

    // Your existing Worker URL – we keep backend as-is
    const MARGO_BACKEND_URL = "https://margo-api.amitjoshirdr.workers.dev";

    // Keys used in localStorage to persist state across sessions
    const LS_KEYS = {
      newsP1: "margo_p1_refinement", // evolving prompt for news brief
      newsArticles: "margo_news_articles", // cached articles (optional)
      searchS1: "margo_search_s1", // evolving search state
      searchAnswer: "margo_search_answer",
      searchResults: "margo_search_results"
    };

    // ===========================
    // HELPER FUNCTIONS
    // ===========================

    /**
     * Sets a status message in a small text area under a section.
     * @param {string} id - DOM element ID (e.g., 'news-status').
     * @param {string} message - Text to display.
     * @param {boolean} isError - If true, makes the text red.
     */
    function setStatus(id, message, isError = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.style.color = isError ? "red" : "#444";
    }

    /**
     * Safely parse JSON from localStorage.
     * Returns null on failure.
     */
    function getJSONFromLocalStorage(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.warn("Failed to parse localStorage JSON for", key, e);
        return null;
      }
    }

    /**
     * Save JSON to localStorage as string.
     */
    function setJSONToLocalStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn("Failed to store localStorage JSON for", key, e);
      }
    }

    /**
     * Call the Margo backend Worker with a simple JSON payload.
     * For now, it uses your already-working /api/generate stub.
     *
     * @param {object} payload - { model, prompt, stream }
     * @returns {Promise<string>} - resolves to data.response string
     */
    async function callMargoBackend(payload) {
      const response = await fetch(`${MARGO_BACKEND_URL}/api/generate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(`Backend error ${response.status}: ${text}`);
      }

      const data = await response.json();
      if (!data || typeof data.response !== "string") {
        throw new Error("Unexpected backend response format (missing response).");
      }

      return data.response;
    }

    // ===========================
    // NEWS BRIEF LOGIC (P0 / P1)
    // ===========================

    /**
     * Load any existing P1 and articles from localStorage on page load.
     * This simulates "existing user" behaviour.
     */
    function initNewsFromStorage() {
      // Load P1 (refined prompt)
      const savedP1 = localStorage.getItem(LS_KEYS.newsP1);
      const newsPromptEl = document.getElementById("news-prompt");
      if (savedP1 && newsPromptEl) {
        newsPromptEl.value = savedP1;
      }

      // Load cached articles if any
      const savedArticles = getJSONFromLocalStorage(LS_KEYS.newsArticles);
      if (Array.isArray(savedArticles) && savedArticles.length > 0) {
        renderNewsArticles(savedArticles);
      }
    }

    /**
     * Render the list of news article cards.
     * Each article is a simple object: { id, title, summary, meta, fullText }
     */
    function renderNewsArticles(articles) {
      const container = document.getElementById("news-articles");
      const detailEl = document.getElementById("news-article-detail");
      if (!container || !detailEl) return;

      container.innerHTML = ""; // clear existing

      if (!Array.isArray(articles) || articles.length === 0) {
        container.innerHTML = "<p>No articles yet. Generate a brief to see results.</p>";
        detailEl.textContent = "No article selected yet.";
        return;
      }

      // Render each article as a clickable card
      articles.forEach((article, index) => {
        const card = document.createElement("div");
        card.className = "article-card";

        // When card is clicked, show full details in the right pane
        card.addEventListener("click", () => {
          const textParts = [
            `Title: ${article.title || "Untitled"}`,
            article.meta ? `Meta: ${article.meta}` : "",
            "",
            article.fullText || article.summary || "(no content)"
          ].filter(Boolean);
          detailEl.textContent = textParts.join("\n");
        });

        const titleEl = document.createElement("h3");
        titleEl.textContent = article.title || `Article ${index + 1}`;

        const metaEl = document.createElement("div");
        metaEl.className = "article-meta";
        metaEl.textContent = article.meta || "No metadata.";

        const summaryEl = document.createElement("div");
        summaryEl.textContent = article.summary || "(no summary)";

        card.appendChild(titleEl);
        card.appendChild(metaEl);
        card.appendChild(summaryEl);
        container.appendChild(card);
      });
    }

    /**
     * Create / update the news brief based on the current prompt.
     * - First call uses prompt as P0 and copies it into P1.
     * - Later calls treat the prompt as updated P1.
     * - For now, we mock article extraction from a single backend response.
     */
    async function handleNewsGenerate() {
      const promptEl = document.getElementById("news-prompt");
      if (!promptEl) return;

      const userPrompt = (promptEl.value || "").trim();

      if (!userPrompt) {
        setStatus("news-status", "Please enter a prompt for your news brief.", true);
        return;
      }

      // In your conceptual model:
      // - First time: userPrompt is P0; P1 starts as P0.
      // - On later tweaks: userPrompt is the updated P1.
      // For simplicity, we just treat the textarea content as current P1.
      const P1 = userPrompt;

      setStatus("news-status", "Curating articles for your brief...", false);
      document.getElementById("btn-news-generate").disabled = true;

      try {
        // Call backend – for now, still stubbed
        const backendResponse = await callMargoBackend({
          model: "test-model", // later: actual model name
          prompt: `MARGO_NEWS_BRIEF_P1:\n${P1}\n\nReturn a short briefing with 3 article ideas.`,
          stream: false
        });

        // Store current P1 in localStorage so it's available next session
        localStorage.setItem(LS_KEYS.newsP1, P1);

        // For now, derive 3 fake articles from the backendResponse
        // Later, you can change this to a structured JSON parse.
        const baseText = backendResponse;
        const articles = [
          {
            id: "a1",
            title: "Article 1 – Overview",
            meta: "Scope & assumptions for your brief.",
            summary: baseText.slice(0, 120) + "...",
            fullText: baseText + "\n\n[Assumption & Scope + Critical Analysis placeholder]"
          },
          {
            id: "a2",
            title: "Article 2 – Critical angle",
            meta: "Critical analysis for your profile.",
            summary: baseText.slice(50, 200) + "...",
            fullText: baseText + "\n\n[Critical analysis placeholder]"
          },
          {
            id: "a3",
            title: "Article 3 – Background",
            meta: "Deep background context.",
            summary: baseText.slice(100, 250) + "...",
            fullText: baseText + "\n\n[Background context placeholder]"
          }
        ];

        // Save articles to localStorage so they persist
        setJSONToLocalStorage(LS_KEYS.newsArticles, articles);

        // Render on UI
        renderNewsArticles(articles);
        setStatus("news-status", "News brief updated.", false);
      } catch (err) {
        console.error("News brief error:", err);
        setStatus(
          "news-status",
          "Could not generate brief: " + (err.message || "Unknown error."),
          true
        );
      } finally {
        document.getElementById("btn-news-generate").disabled = false;
      }
    }

    /**
     * Hard reset for news brief:
     * - Clears P1
     * - Clears articles
     * - Resets UI
     */
    function handleNewsReset() {
      localStorage.removeItem(LS_KEYS.newsP1);
      localStorage.removeItem(LS_KEYS.newsArticles);

      const promptEl = document.getElementById("news-prompt");
      const detailEl = document.getElementById("news-article-detail");

      if (promptEl) promptEl.value = "";
      if (detailEl) detailEl.textContent = "No article selected yet.";

      renderNewsArticles([]); // will show "No articles yet" message
      setStatus("news-status", "News brief reset. Start fresh with a new prompt.", false);
    }

    // ===========================
    // SEARCH LOGIC (S0 / S1)
    // ===========================

    /**
     * Initialize search state from localStorage.
     */
    function initSearchFromStorage() {
      const savedS1 = localStorage.getItem(LS_KEYS.searchS1);
      const searchInputEl = document.getElementById("search-input");
      if (savedS1 && searchInputEl) {
        searchInputEl.value = savedS1;
      }

      const savedAnswer = localStorage.getItem(LS_KEYS.searchAnswer);
      const answerEl = document.getElementById("search-answer");
      if (savedAnswer && answerEl) {
        answerEl.textContent = savedAnswer;
      }

      const savedResults = getJSONFromLocalStorage(LS_KEYS.searchResults);
      if (Array.isArray(savedResults)) {
        renderSearchResults(savedResults);
      }
    }

    /**
     * Render list of search results (up to 5).
     */
    function renderSearchResults(results) {
      const listEl = document.getElementById("search-results-list");
      if (!listEl) return;

      listEl.innerHTML = "";

      if (!Array.isArray(results) || results.length === 0) {
        listEl.innerHTML = "<li>No results yet.</li>";
        return;
      }

      results.slice(0, 5).forEach((item, index) => {
        const li = document.createElement("li");
        // Simple text for now; later you can add links, sources, etc.
        li.textContent = item.title || `Result ${index + 1}: ${item.snippet || ""}`;
        listEl.appendChild(li);
      });
    }

    /**
     * Handle search / follow-up (S0/S1).
     * - First input behaves as S0.
     * - Later inputs refine S1.
     */
    async function handleSearchRun() {
      const inputEl = document.getElementById("search-input");
      const answerEl = document.getElementById("search-answer");
      if (!inputEl || !answerEl) return;

      const query = (inputEl.value || "").trim();
      if (!query) {
        setStatus("search-status", "Please enter a search query.", true);
        return;
      }

      // Treat the input value as current S1 (first time S0 = S1)
      const S1 = query;

      setStatus("search-status", "Running search and generating answer...", false);
      document.getElementById("btn-search-run").disabled = true;

      try {
        // Call backend with a search-oriented prompt
        const backendResponse = await callMargoBackend({
          model: "test-model",
          prompt: `MARGO_SEARCH_S1:\n${S1}\n\nReturn a concise answer with inline citations and a short list of 5 key result titles/snippets.`,
          stream: false
        });

        // For now, we treat the backendResponse as a plain answer,
        // and synthesize 5 mock "results" from it.
        const answerText = backendResponse;

        // Create fake results for now
        const results = Array.from({ length: 5 }).map((_, i) => ({
          id: `r${i + 1}`,
          title: `Result ${i + 1} (mock)`,
          snippet: backendResponse.slice(i * 40, i * 40 + 60) + "..."
        }));

        // Save S1 and outputs
        localStorage.setItem(LS_KEYS.searchS1, S1);
        localStorage.setItem(LS_KEYS.searchAnswer, answerText);
        setJSONToLocalStorage(LS_KEYS.searchResults, results);

        // Update UI
        answerEl.textContent = answerText;
        renderSearchResults(results);
        setStatus("search-status", "Search updated.", false);
      } catch (err) {
        console.error("Search error:", err);
        setStatus(
          "search-status",
          "Could not complete search: " + (err.message || "Unknown error."),
          true
        );
      } finally {
        document.getElementById("btn-search-run").disabled = false;
      }
    }

    /**
     * Hard reset for search:
     * - Clears S0/S1 (we only store S1)
     * - Clears answer and results
     */
    function handleSearchReset() {
      localStorage.removeItem(LS_KEYS.searchS1);
      localStorage.removeItem(LS_KEYS.searchAnswer);
      localStorage.removeItem(LS_KEYS.searchResults);

      const inputEl = document.getElementById("search-input");
      const answerEl = document.getElementById("search-answer");

      if (inputEl) inputEl.value = "";
      if (answerEl) answerEl.textContent = "Ask a question to see an answer here.";

      renderSearchResults([]);
      setStatus("search-status", "Search reset. Start a fresh query.", false);
    }

    // ===========================
    // INITIALIZATION
    // ===========================

    /**
     * Wire up event listeners and restore any saved state when page loads.
     */
    function initApp() {
      // NEWS
      document
        .getElementById("btn-news-generate")
        .addEventListener("click", handleNewsGenerate);
      document
        .getElementById("btn-news-reset")
        .addEventListener("click", handleNewsReset);

      initNewsFromStorage();

      // SEARCH
      document
        .getElementById("btn-search-run")
        .addEventListener("click", handleSearchRun);
      document
        .getElementById("btn-search-reset")
        .addEventListener("click", handleSearchReset);

      initSearchFromStorage();
    }

    // Run init when DOM is ready
    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
