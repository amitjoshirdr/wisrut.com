<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Margo – Student News Brief & Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Basic layout styling */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f7f7f7;
    }

    h1, h2 {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .section {
      background: #ffffff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .col {
      flex: 1 1 300px;
      min-width: 0;
    }

	textarea,
	input[type="text"] {
	  width: 100%;
	  box-sizing: border-box;
	  padding: 0.5rem;
	  margin-bottom: 0.5rem;
	  border-radius: 4px;
	  border: 1px solid #ccc;
	  font-family: inherit;
	  font-size: 0.9rem;
	  text-indent: 0;
	  line-height: 1.4;
	}

    button {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button.secondary {
      background: #888;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .articles {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .article-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.75rem;
      background: #fafafa;
      cursor: pointer;
    }

    .article-card h3 {
      margin: 0 0 0.25rem 0;
      font-size: 1rem;
    }

    .article-meta {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.25rem;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.85rem;
      background: #f0f0f0;
      padding: 0.75rem;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .ai-answer {
      font-size: 0.9rem;
      white-space: pre-wrap;
      background: #f9f9ff;
      border-radius: 6px;
      padding: 0.75rem;
    }

    .search-results {
      font-size: 0.85rem;
    }

    .search-results ul {
      padding-left: 1.1rem;
    }
  </style>
</head>

<body>

	<div style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;">
  <a
    href="https://wisrut.com"
    style="display: inline-block; padding: 0.5rem 0.9rem; background: #222; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.9rem;"
  >
    ← Back to Wisrut
  </a>

  <div style="font-size: 0.9rem; color: #666;">
    Margo by Wisrut
  </div>
</div>

  <h1>Margo – Student News Brief & Search</h1>

  <!-- NEWS BRIEF SECTION (P0 / P1) -->
  <section class="section" id="news-section">
    <h2>News Brief</h2>

    <!-- News prompt area -->
    <label for="news-prompt">
      Please type your news brief prompt. 
    </label>
    <!-- P0 = first 50 words, P1 = evolving refinement; we store only the current P1 here -->
    <textarea
      id="news-prompt"
      rows="3"
      placeholder="Example: I am a Class 11 student preparing for CBSE boards. Show me daily, bias-aware news about Indian economy and science."></textarea>

    <!-- Controls for generating and resetting -->
    <div>
      <button id="btn-news-generate">Generate / Update Brief</button>
      <button id="btn-news-reset" class="secondary">Hard reset news brief</button>
    </div>

    <!-- Status text for news -->
    <div id="news-status" class="status"></div>

    <!-- Articles list + selected details -->
    <div class="row" style="margin-top: 1rem;">
      <!-- Left: article cards -->
      <div class="col">
        <h3>Articles (click to read)</h3>
        <div id="news-articles" class="articles">
          <!-- Article cards will be rendered here -->
        </div>
      </div>

      <!-- Right: selected article details -->
      <div class="col">
        <h3>Selected article</h3>
        <pre id="news-article-detail">No article selected yet.</pre>
      </div>
    </div>
  </section>

  <!-- SEARCH SECTION (S0 / S1) -->
  <section class="section" id="search-section">
    <h2>Search</h2>

    <!-- Search input -->
    <label for="search-input">
      Please type your search query
    </label>
    <input
      type="text"
      id="search-input"
      placeholder="Example: Explain the new NEP policy for school students"
    />

    <div>
      <button id="btn-search-run">Search / Ask follow‑up</button>
      <button id="btn-search-reset" class="secondary">Start fresh search</button>
    </div>

    <!-- Status text for search -->
    <div id="search-status" class="status"></div>

    <div class="row" style="margin-top: 1rem;">
      <!-- Left: AI answer -->
      <div class="col">
        <h3>AI answer (with citations)</h3>
        <div id="search-answer" class="ai-answer">
          Ask a question to see an answer here.
        </div>
      </div>

      <!-- Right: Top 5 results -->
      <div class="col">
        <h3>Top 5 results</h3>
        <div id="search-results" class="search-results">
          <ul id="search-results-list">
            <li>No results yet.</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- APP LOGIC -->
<script>
  // =============================
  // CONFIG & LOCAL STORAGE KEYS
  // =============================

  const MARGOBACKENDURL = "https://margo-api.amitjoshirdr.workers.dev";

  const LSKEYS = {
    newsP1: "margop1refinement",
    newsArticles: "margonewsarticles",
    searchS1: "margosearchs1",
    searchAnswer: "margosearchanswer",
    searchResults: "margosearchresults"
  };

  // =============================
  // HELPER FUNCTIONS
  // =============================

  function setStatus(id, message, isError = false) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = message;
    el.style.color = isError ? "red" : "#444";
  }

  function getJSONFromLocalStorage(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function setJSONToLocalStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }

  // Convert markdown bold (**text**) and horizontal rules (---) to simple HTML
  function markdownToHtml(text) {
    if (!text) return "";
    return text
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")  // **bold** → <strong>
      .replace(/\*(.*?)\*/g, "<em>$1</em>")              // *italic* → <em>
      .replace(/^---+$/gm, "<hr>")                       // --- → <hr>
      .replace(/\n/g, "<br>");                           // newlines → <br>
  }

  // Call the Margo backend Worker
  async function callMargoBackend(payload) {
    const response = await fetch(`${MARGOBACKENDURL}/api/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const text = await response.text();
      throw new Error(`Backend error ${response.status}: ${text}`);
    }

    const data = await response.json();
    if (!data || typeof data.response !== "string") {
      throw new Error("Unexpected backend response format (missing 'response').");
    }

    return data.response;
  }

  // =============================
  // ARTICLE PARSER
  // =============================

  // Splits AI response into 3 article objects by looking for
  // "Article Idea 1", "Article Idea 2", "Article Idea 3" markers.
  // Falls back to splitting by "---" if those markers aren't found.

function parseArticles(backendResponse) {
  if (!backendResponse || typeof backendResponse !== "string") {
    return [];
  }

  // Split into chunks by lines containing only ---
  const rawChunks = backendResponse
    .split(/\n-{3,}\n/g)
    .map(c => c.trim())
    .filter(c => c.length > 0);

  if (rawChunks.length >= 2) {
    return rawChunks.slice(0, 3).map((chunk, index) => {
      const lines = chunk.split("\n").map(l => l.trim()).filter(Boolean);

      const headline = lines[0] || `Article ${index + 1}`;
      const byline =
        lines[1] && !/^\s*$/.test(lines[1])
          ? lines[1]
          : "By Margo News Desk";

      const bodyLines = lines.slice(2);
      const bodyText = bodyLines.join("\n\n");

      const summarySentence = (bodyText.match(/[^.!?]+[.!?]/g) || [bodyText])
        .slice(0, 2)
        .join(" ")
        .trim();

      return {
        id: `a${index + 1}`,
        title: headline,
        meta: byline,
        summary: summarySentence || "Tap to read the full article.",
        fullText: markdownToHtml(bodyText)
      };
    });
  }

    // Last resort: show the whole response as one article
    return [
      {
        id: "a1",
        title: "Brief summary",
        meta: "Full AI response",
        summary: backendResponse.replace(/\*+/g, "").slice(0, 150),
        fullText: markdownToHtml(backendResponse)
      }
    ];
  }

  // Extract a named section (e.g. "Assumptions", "Scope") from a chunk
  function extractSection(text, sectionName) {
    const regex = new RegExp(
      `\\*{0,2}${sectionName}\\*{0,2}[:\\s]*([\\s\\S]*?)(?=\\*{0,2}(?:Assumptions|Scope|Critical Analysis)\\*{0,2}[:\\s]|$)`,
      "i"
    );
    const match = text.match(regex);
    if (!match) return "";
    return markdownToHtml(match[1].trim());
  }

  // =============================
  // NEWS BRIEF LOGIC (P0 / P1)
  // =============================

	function initNewsFromStorage() {
	  const savedP1Raw = localStorage.getItem(LSKEYS.newsP1);
	  const savedP1 = savedP1Raw ? savedP1Raw.trim() : "";
	  const newsPromptEl = document.getElementById("news-prompt");

	  if (savedP1 && newsPromptEl) {
		newsPromptEl.value = savedP1;
	  } else if (newsPromptEl) {
		newsPromptEl.value = "";
	  }

	  const savedArticles = getJSONFromLocalStorage(LSKEYS.newsArticles);
	  renderNewsArticles(
		Array.isArray(savedArticles) && savedArticles.length > 0
		  ? savedArticles
		  : []
	  );
	}

  function renderNewsArticles(articles) {
  const container = document.getElementById("news-articles");
  const detailEl = document.getElementById("news-article-detail");
  if (!container || !detailEl) return;

  container.innerHTML = "";

  if (!Array.isArray(articles) || articles.length === 0) {
    container.innerHTML = "<p>No articles yet. Generate a brief to see results.</p>";
    detailEl.innerHTML = "No article selected yet.";
    return;
  }

  articles.forEach((article) => {
    const card = document.createElement("div");
    card.className = "article-card";

    card.addEventListener("click", () => {
      detailEl.innerHTML = `
        <strong style="font-size:1.05rem;">${article.title}</strong><br>
        <span style="font-size:0.8rem;color:#666">${article.meta}</span>
        <hr>
        <div>${article.fullText}</div>
      `;
    });

    const titleEl = document.createElement("h3");
    titleEl.textContent = article.title;

    const metaEl = document.createElement("div");
    metaEl.className = "article-meta";
    metaEl.textContent = article.meta;

    const summaryEl = document.createElement("div");
    summaryEl.textContent = article.summary;

    card.appendChild(titleEl);
    card.appendChild(metaEl);
    card.appendChild(summaryEl);
    container.appendChild(card);
  });
}

  async function handleNewsGenerate() {
    const promptEl = document.getElementById("news-prompt");
    if (!promptEl) return;

    const userPrompt = (promptEl.value || "").trim();
    if (!userPrompt) {
      setStatus("news-status", "Please enter a prompt for your news brief.", true);
      return;
    }

    const P1 = userPrompt;
	
	// Debug
	console.log("NEWS PROMPT SENT:", P1);
	
	
    setStatus("news-status", "Curating articles for your brief...", false);
    document.getElementById("btn-news-generate").disabled = true;

    try {
      const backendResponse = await callMargoBackend({
        model: "auto",
        prompt: `You are Margo, a trust-first news assistant for students.

			Given this student profile and interest:
			"${P1}"

			Write exactly 3 structured article ideas. Format each article as:

			Article Idea 1: [Title]

			**Assumptions:**
			- [point]
			- [point]

			**Scope:**
			- [point]
			- [point]

			**Critical Analysis:**
			- [point]
			- [point]

			---

			Article Idea 2: [Title]

			**Assumptions:**
			...
			(same format)

			---

			Article Idea 3: [Title]

			**Assumptions:**
			...
			(same format)

			Keep each section concise and student-friendly.`,
					stream: false
				  });

      // Debug
	  console.log("NEWS RESPONSE:", backendResponse);
	  
	  // Save P1
      localStorage.setItem(LSKEYS.newsP1, P1);

	
		
		

      // Parse the AI response into 3 structured articles
      const articles = parseArticles(backendResponse);

      setJSONToLocalStorage(LSKEYS.newsArticles, articles);
      renderNewsArticles(articles);
      setStatus("news-status", "News brief updated.", false);

    } catch (err) {
      console.error("News brief error", err);
      setStatus(
        "news-status",
        `Could not generate brief: ${err.message || "Unknown error"}.`,
        true
      );
    } finally {
      document.getElementById("btn-news-generate").disabled = false;
    }
  }

  function handleNewsReset() {
    localStorage.removeItem(LSKEYS.newsP1);
    localStorage.removeItem(LSKEYS.newsArticles);

    const promptEl = document.getElementById("news-prompt");
    const detailEl = document.getElementById("news-article-detail");
    if (promptEl) promptEl.value = "";
    if (detailEl) detailEl.innerHTML = "No article selected yet.";

    renderNewsArticles([]);
    setStatus("news-status", "News brief reset. Start fresh with a new prompt.", false);
  }

  // =============================
  // SEARCH LOGIC (S0 / S1)
  // =============================

	function initSearchFromStorage() {
	  const savedS1 = localStorage.getItem(LSKEYS.searchS1);
	  const searchInputEl = document.getElementById("search-input");
	  if (savedS1 && searchInputEl) {
		searchInputEl.value = savedS1;
	  }

	  const savedAnswer = localStorage.getItem(LSKEYS.searchAnswer);
	  const answerEl = document.getElementById("search-answer");
	  if (savedAnswer && answerEl) {
		answerEl.innerHTML = savedAnswer;
	  }

	  const savedResults = getJSONFromLocalStorage(LSKEYS.searchResults);
	  renderSearchResults(
		Array.isArray(savedResults) && savedResults.length > 0
		  ? savedResults
		  : []
	  );
	}

  function renderSearchResults(results) {
    const listEl = document.getElementById("search-results-list");
    if (!listEl) return;
    listEl.innerHTML = "";

    if (!Array.isArray(results) || results.length === 0) {
      listEl.innerHTML = "<li>No results yet.</li>";
      return;
    }

    results.slice(0, 5).forEach((item, index) => {
      const li = document.createElement("li");
      li.textContent =
        (item.title || `Result ${index + 1}`) +
        (item.snippet ? ` – ${item.snippet}` : "");
      listEl.appendChild(li);
    });
  }

		// Parse the search response into:
		// 1) headline
		// 2) byline
		// 3) article body
		// 4) top 5 source/result lines
	function parseSearchResponse(rawText) {
		  if (!rawText || typeof rawText !== "string") {
			return {
			  headline: "Search answer",
			  byline: "By Margo Search",
			  bodyHtml: "No response available.",
			  results: []
			};
		  }

		  // Split article body from the "Top 5 Sources:" section
		  const parts = rawText.split(/\bTop 5 Sources:\b/i);
		  const articlePart = (parts[0] || "").trim();
		  const sourcesPart = (parts[1] || "").trim();

		  // Break article part into non-empty lines
		  const lines = articlePart
			.split("\n")
			.map(line => line.trim())
			.filter(Boolean);

		  const headline = lines[0] || "Search answer";
		  const byline = lines[1] || "By Margo Search";

		  // Everything after headline + byline becomes the article body
		  const bodyText = lines.slice(2).join("\n\n").trim();

		  // Convert the body to simple HTML so markdown-like text displays cleanly
		  const bodyHtml = markdownToHtml(bodyText || "No article body available.");

		  // Parse sources/results into a clean 5-item list
		  const results = sourcesPart
			.split("\n")
			.map(line => line.replace(/^[\s\-\*\d\.\)\(]+/, "").trim())
			.filter(line => line.length > 3)
			.slice(0, 5)
			.map((line, index) => ({
			  id: `r${index + 1}`,
			  title: line,
			  snippet: ""
			}));

		  return {
			headline,
			byline,
			bodyHtml,
			results
		  };
		}

async function handleSearchRun() {
  const inputEl = document.getElementById("search-input");
  const answerEl = document.getElementById("search-answer");

  if (!inputEl || !answerEl) return;

  const query = (inputEl.value || "").trim();
  if (!query) {
    setStatus("search-status", "Please enter a search query.", true);
    return;
  }

  // In your model, first query acts like S0, then the evolving query is S1.
  // For now we store only the current refined form.
  const S1 = query;

  setStatus("search-status", "Running search and generating answer...", false);
  document.getElementById("btn-search-run").disabled = true;

  try {
    const backendResponse = await callMargoBackend({
      model: "auto",
      prompt: `You are Margo, a trust-first search assistant for students.

		User query:
		"${S1}"

		Write ONE complete, student-friendly article-style answer.

		The answer should feel like a well-written short article, not bullet notes.
		Write naturally, without explicitly labeling sections like "thesis", "scope", or "conclusion".

		Structure it like this:
		1. A clear headline on the first line.
		2. A natural byline/context line on the second line.
		3. A short lead paragraph that frames the topic.
		4. A body that explains the issue clearly, develops one central idea, includes supporting evidence, and naturally mentions assumptions, limits, and critical analysis where relevant.
		5. A short concluding paragraph that gives the main takeaway.

		After the article, add this exact heading on a new line:
		Top 5 Sources:

		Then list 5 source names or result titles, one per line.

		Do not use raw URLs unless necessary. Keep the tone analytical, clear, and suitable for students.`,
			  stream: false
			});

			// Parse the returned text into article-style answer + results list
			const parsed = parseSearchResponse(backendResponse);

			// Save current search state
			localStorage.setItem(LSKEYS.searchS1, S1);

			// Save the rendered answer as HTML-ready data
			const fullAnswerHtml = `
			  <strong style="font-size:1.05rem;">${parsed.headline}</strong><br>
			  <span style="font-size:0.8rem;color:#666">${parsed.byline}</span>
			  <hr>
			  <div>${parsed.bodyHtml}</div>
			`;

			localStorage.setItem(LSKEYS.searchAnswer, fullAnswerHtml);
			setJSONToLocalStorage(LSKEYS.searchResults, parsed.results);

			// Update UI
			answerEl.innerHTML = fullAnswerHtml;
			renderSearchResults(parsed.results);

			setStatus("search-status", "Search updated.", false);
		  } catch (err) {
			console.error("Search error", err);
			setStatus(
			  "search-status",
			  `Could not complete search: ${err.message || "Unknown error"}.`,
			  true
			);
		  } finally {
			document.getElementById("btn-search-run").disabled = false;
		  }
}
  function handleSearchReset() {
    localStorage.removeItem(LSKEYS.searchS1);
    localStorage.removeItem(LSKEYS.searchAnswer);
    localStorage.removeItem(LSKEYS.searchResults);

    const inputEl = document.getElementById("search-input");
    const answerEl = document.getElementById("search-answer");
    if (inputEl) inputEl.value = "";
    if (answerEl) answerEl.innerHTML = "Ask a question to see an answer here.";

    renderSearchResults([]);
    setStatus("search-status", "Search reset. Start a fresh query.", false);
  }

  // =============================
  // INITIALIZATION
  // =============================

  function initApp() {
    document.getElementById("btn-news-generate")
      .addEventListener("click", handleNewsGenerate);
    document.getElementById("btn-news-reset")
      .addEventListener("click", handleNewsReset);
    initNewsFromStorage();

    document.getElementById("btn-search-run")
      .addEventListener("click", handleSearchRun);
    document.getElementById("btn-search-reset")
      .addEventListener("click", handleSearchReset);
    initSearchFromStorage();
  }

  document.addEventListener("DOMContentLoaded", initApp);
</script>


</body>
</html>
